<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction Result – AgriInsure AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--green:#1db954;--dark:#0a1628;--card:#111e35;--border:rgba(29,185,84,.25);}
  body{background:var(--dark);color:#e0eaf4;font-family:'DM Sans',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;padding:2rem 1rem;}
  .result-card{background:var(--card);border:1px solid var(--border);
               border-radius:1.5rem;padding:2.5rem 2rem;max-width:520px;
               width:100%;text-align:center;box-shadow:0 16px 60px rgba(0,0,0,.5);}
  .result-icon{font-size:4rem;line-height:1;margin-bottom:.75rem;}
  .result-label{font-family:'Syne',sans-serif;font-weight:800;
                font-size:2rem;margin:.5rem 0;}
  .result-label.danger{color:#e74c3c;}
  .result-label.success{color:var(--green);}
  .result-label.warning{color:#f39c12;}
  .confidence-bar{background:rgba(255,255,255,.08);border-radius:999px;
                  height:10px;overflow:hidden;margin:1rem 0 .25rem;}
  .confidence-fill{height:100%;border-radius:999px;transition:width 1s ease;}
  .confidence-fill.danger{background:#e74c3c;}
  .confidence-fill.success{background:var(--green);}
  .advice-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
              border-radius:.75rem;padding:1rem;margin:1.25rem 0;
              font-size:.9rem;color:#adc8e0;text-align:left;}
  .model-badge{display:inline-block;background:rgba(29,185,84,.1);color:var(--green);
               border:1px solid var(--border);border-radius:999px;
               padding:.2rem .75rem;font-size:.75rem;}
  .btn-back{background:transparent;color:var(--green);border:1px solid var(--border);
            border-radius:.6rem;padding:.65rem 1.75rem;font-size:.9rem;
            text-decoration:none;transition:background .2s;}
  .btn-back:hover{background:rgba(29,185,84,.1);color:var(--green);}
</style>
</head>
<body>
<div class="result-card">
  <div class="result-icon">{{ icon }}</div>
  <div class="model-badge">{{ model_name }}</div>
  <div class="result-label {{ color }}">{{ result }}</div>

  <p style="color:#8899aa;font-size:.85rem;margin-bottom:.25rem;">Confidence Score</p>
  <div class="confidence-bar">
    <div class="confidence-fill {{ color }}" style="width:{{ confidence }}%"></div>
  </div>
  <p style="font-size:1.25rem;font-weight:600;color:#fff;">{{ confidence }}%</p>

  <div class="advice-box">
    <strong style="color:#e0eaf4;">💡 Advisory: </strong>{{ advice }}
  </div>

  <a href="/" class="btn-back">← New Prediction</a>
</div>
</body>
</html>
